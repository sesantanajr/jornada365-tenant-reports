name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate plugin metadata and build the installer
        run: python3 scripts/package.py

  release:
    needs: package
    if: github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the version and prepare the ZIP
        id: package
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          slug=jornada365-tenant-portal
          entry="wordpress/$slug/$slug.php"
          zip=$(python3 scripts/package.py)
          filename=${zip##*/}
          version=${filename#"$slug"-}
          version=${version%.zip}
          if [[ "$GITHUB_EVENT_NAME" == push && ! "$BEFORE" =~ ^0+$ ]]; then
            if git cat-file -e "$BEFORE:$entry" 2>/dev/null; then
              previous=$(git show "$BEFORE:$entry" | sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p')
              if [[ "$previous" == "$version" ]]; then exit 0; fi
            fi
          fi
          # The asset keeps a stable name for the latest-release installation link.
          cp "$zip" "dist/$slug.zip"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Publish the WordPress installer
        if: steps.package.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          slug=jornada365-tenant-portal
          if gh release view "$TAG" --json assets,isDraft > "$RUNNER_TEMP/release.json"; then
            jq -e --arg name "$slug.zip" '(.isDraft == false) and any(.assets[]; .name == $name)' "$RUNNER_TEMP/release.json" >/dev/null
            echo "Release $TAG already has its installer."
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$GITHUB_SHA" ]] || { echo "::error::Tag $TAG points to a different commit."; exit 1; }
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v header="= ${TAG#v} =" '{ sub(/\r$/, "") } $0 == header { found=1; next } found && /^=/ { exit } found { print }' "wordpress/$slug/readme.txt" > "$notes"
          test -s "$notes"
          gh release create "$TAG" "dist/$slug.zip" --target "$GITHUB_SHA" --title "Tenant Jornada365 ${TAG#v}" --notes-file "$notes"
